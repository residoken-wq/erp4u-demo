name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Lint, Test, Build)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Backend Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Backend Unit Tests
        run: npm test

      - name: Run Backend Build
        run: npm run build

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Build
        run: |
          cd frontend
          npm run build

      - name: ShellCheck deploy scripts
        run: npx --yes shellcheck scripts/*.sh

      - name: Test Deploy Scripts (Mock Docker)
        run: bash test/deploy-scripts.test.sh

  migrations:
    name: Verify Migrations (Parity, Drift, Revert)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: erp4u_ci
          POSTGRES_PASSWORD: erp4u_ci
          POSTGRES_DB: erp4u_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U erp4u_ci -d erp4u_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: erp4u_ci
      DB_PASSWORD: erp4u_ci
      PGPASSWORD: erp4u_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Verify Schema Parity (synchronize vs migrations)
        run: |
          PG_EXEC="docker run --rm --network host -e PGPASSWORD=${PGPASSWORD} postgres:15"
          $PG_EXEC pg_dump --version

          $PG_EXEC psql -h 127.0.0.1 -p 5432 -U erp4u_ci -d erp4u_ci -c "CREATE DATABASE sync_db;"
          $PG_EXEC psql -h 127.0.0.1 -p 5432 -U erp4u_ci -d erp4u_ci -c "CREATE DATABASE mig_db;"

          DB_DATABASE=sync_db npx ts-node scripts/ci/schema-sync.ts
          DB_DATABASE=mig_db npm run migration:run

          $PG_EXEC pg_dump -h 127.0.0.1 -p 5432 -U erp4u_ci --schema-only --no-owner --no-privileges \
            -T public.migrations -T public.migrations_id_seq sync_db \
            | grep -Ev '^\\(un)?restrict\b' > /tmp/sync_schema.sql

          $PG_EXEC pg_dump -h 127.0.0.1 -p 5432 -U erp4u_ci --schema-only --no-owner --no-privileges \
            -T public.migrations -T public.migrations_id_seq mig_db \
            | grep -Ev '^\\(un)?restrict\b' > /tmp/mig_schema.sql

          diff -u /tmp/sync_schema.sql /tmp/mig_schema.sql

      - name: Check for Missing Migrations (Drift Check)
        env:
          DB_DATABASE: mig_db
        run: npm run migration:check

      - name: Verify Migration Revert & Re-run
        env:
          DB_DATABASE: mig_db
        run: |
          npm run migration:revert
          npm run migration:run
          npm run migration:show

      - name: Run Tenant Isolation Integration Tests
        env:
          DB_DATABASE: erp4u_ci
          DB_AUTO_MIGRATE: 'false'
        run: npm run test:int

      - name: Smoke boot
        env:
          DB_DATABASE: mig_db
          DB_AUTO_MIGRATE: 'true'
          NODE_ENV: production
          PORT: '3000'
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY: ci-dummy-encryption-key-0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost
        run: |
          set -euo pipefail

          for mode in all db; do
            echo "=== Smoke boot (ENTITLEMENTS_MODE=${mode}) ==="
            LOG_FILE="/tmp/smoke-boot-${mode}.log"
            ENTITLEMENTS_MODE="${mode}" node dist/main.js >"${LOG_FILE}" 2>&1 &
            APP_PID=$!

            READY=0
            HEALTH_BODY=""
            for _ in $(seq 1 90); do
              if ! kill -0 "${APP_PID}" 2>/dev/null; then
                echo "App process exited prematurely (ENTITLEMENTS_MODE=${mode})"
                break
              fi
              if HEALTH_BODY=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null); then
                if [ "${HEALTH_BODY}" = '{"status":"ok"}' ]; then
                  READY=1
                  break
                fi
              fi
              sleep 1
            done

            if [ "${READY}" -ne 1 ]; then
              echo "Smoke boot failed for ENTITLEMENTS_MODE=${mode} (last health body: ${HEALTH_BODY})"
              tail -n 100 "${LOG_FILE}" || true
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
              exit 1
            fi

            META_CODE=$(curl -sS -o /tmp/meta.out -w '%{http_code}' http://127.0.0.1:3000/api/public/meta)
            if [ "${META_CODE}" != "200" ]; then
              echo "Expected /api/public/meta 200, got ${META_CODE} (ENTITLEMENTS_MODE=${mode})"
              cat /tmp/meta.out || true
              tail -n 100 "${LOG_FILE}" || true
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
              exit 1
            fi

            echo "PASS ENTITLEMENTS_MODE=${mode}: /api/health=${HEALTH_BODY}, /api/public/meta=${META_CODE} $(cat /tmp/meta.out)"
            kill "${APP_PID}" 2>/dev/null || true
            wait "${APP_PID}" 2>/dev/null || true
          done

      - name: Smoke boot (CORE_INCLUDE_PREMIUM=false)
        env:
          DB_DATABASE: mig_db
          DB_AUTO_MIGRATE: 'true'
          NODE_ENV: production
          PORT: '3000'
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY: ci-dummy-encryption-key-0123456789abcdef0123456789abcdef
          CORS_ORIGINS: http://localhost
          CORE_INCLUDE_PREMIUM: 'false'
        run: |
          set -euo pipefail

          echo "=== Smoke boot (CORE_INCLUDE_PREMIUM=false) ==="
          LOG_FILE="/tmp/smoke-boot-no-premium.log"
          node dist/main.js >"${LOG_FILE}" 2>&1 &
          APP_PID=$!

          READY=0
          HEALTH_BODY=""
          for _ in $(seq 1 90); do
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "App process exited prematurely (CORE_INCLUDE_PREMIUM=false)"
              break
            fi
            if HEALTH_BODY=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null); then
              if [ "${HEALTH_BODY}" = '{"status":"ok"}' ]; then
                READY=1
                break
              fi
            fi
            sleep 1
          done

          if [ "${READY}" -ne 1 ]; then
            echo "Smoke boot failed for CORE_INCLUDE_PREMIUM=false (last health body: ${HEALTH_BODY})"
            tail -n 100 "${LOG_FILE}" || true
            kill "${APP_PID}" 2>/dev/null || true
            wait "${APP_PID}" 2>/dev/null || true
            exit 1
          fi

          META_CODE=$(curl -sS -o /tmp/meta.out -w '%{http_code}' http://127.0.0.1:3000/api/public/meta)
          if [ "${META_CODE}" != "200" ]; then
            echo "Expected /api/public/meta 200, got ${META_CODE} (CORE_INCLUDE_PREMIUM=false)"
            cat /tmp/meta.out || true
            tail -n 100 "${LOG_FILE}" || true
            kill "${APP_PID}" 2>/dev/null || true
            wait "${APP_PID}" 2>/dev/null || true
            exit 1
          fi

          # Route from premium add-on must return 404 (AiController: /api/ai/pricing)
          AI_CODE=$(curl -sS -o /tmp/ai.out -w '%{http_code}' -X POST http://127.0.0.1:3000/api/ai/pricing -H 'Content-Type: application/json' -d '{}')
          if [ "${AI_CODE}" != "404" ]; then
            echo "Expected /api/ai/pricing 404 when premium disabled, got ${AI_CODE}"
            cat /tmp/ai.out || true
            tail -n 100 "${LOG_FILE}" || true
            kill "${APP_PID}" 2>/dev/null || true
            wait "${APP_PID}" 2>/dev/null || true
            exit 1
          fi

          echo "PASS CORE_INCLUDE_PREMIUM=false: /api/health=${HEALTH_BODY}, /api/public/meta=${META_CODE}, /api/ai/pricing=${AI_CODE}"
          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true

          echo "=== Fail-fast check: missing JWT_SECRET in production must exit != 0 within 30s ==="
          FAIL_FAST_LOG="/tmp/fail-fast-smoke.log"
          set +e
          (
            unset JWT_SECRET
            export NODE_ENV=production
            export DB_DATABASE=mig_db
            export DB_AUTO_MIGRATE=false
            export ENCRYPTION_KEY="ci-dummy-encryption-key-0123456789abcdef0123456789abcdef"
            timeout 30s node dist/main.js >"${FAIL_FAST_LOG}" 2>&1
          )
          FAIL_EXIT=$?
          set -e
          if [ "${FAIL_EXIT}" -eq 0 ] || [ "${FAIL_EXIT}" -eq 124 ]; then
            echo "Expected exit != 0 (and not 124 timeout) when JWT_SECRET is missing, got ${FAIL_EXIT}"
            cat "${FAIL_FAST_LOG}" || true
            exit 1
          fi
          echo "PASS Fail-fast check: process exited with code ${FAIL_EXIT}"

  image:
    name: Build & Push Docker Images
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (API runtime)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/erp4u-demo-api
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (API runtime)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (API tools)
        id: meta-tools
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/erp4u-demo-api
          flavor: |
            latest=false
          tags: |
            type=raw,value=tools-latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=tools-sha-,format=short

      - name: Build and push Docker image (API tools)
        id: build-tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: build
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha

      - name: Extract Docker metadata (Web frontend)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/erp4u-demo-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (Web frontend)
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image digest to job summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "### Docker Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API Runtime Image**: \`ghcr.io/residoken-wq/erp4u-demo-api\`" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-api.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Tools Image**: \`ghcr.io/residoken-wq/erp4u-demo-api\` (target: \`build\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-tools.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Frontend Image**: \`ghcr.io/residoken-wq/erp4u-demo-web\`" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-web.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
